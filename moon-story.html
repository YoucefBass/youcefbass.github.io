<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Her Moon</title>

<style>

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    opacity:0;
    transform:scale(.7);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Georgia, serif;
}

#intro{
    font-size:clamp(30px, 9vw, 42px);
    max-width:85%;
    text-align:center;
    line-height:1.3;
    opacity:0;
    transition:2s;
}




#moon{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    opacity:0;

    user-select:none;
    pointer-events:none;

   filter:
    brightness(1.05)
    contrast(1.08)
    drop-shadow(0 0 5px rgba(255,255,255,.10))
    drop-shadow(0 0 12px rgba(255,255,255,.05));
}











#moonGlow{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:250px;

    opacity:0;

    pointer-events:none;

    filter:
        blur(8px)
        brightness(2);

    z-index:1;
}

#moon{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:250px;

    opacity:0;

    pointer-events:none;

    z-index:2;
}
#lovePopup{
    position:fixed;
    inset:0;
    z-index:10;

    background:rgba(0,0,0,.75);

background:transparent;
    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    transition:.4s;
}

#lovePopup.show{
    opacity:1;
    visibility:visible;
}

.popupBox{
position:relative;
    z-index:20;
    
    width:320px;
    max-width:90%;

    padding:35px;

    background:rgba(18,18,18,.95);

    border:1px solid rgba(255,255,255,.2);
    border-radius:18px;

    text-align:center;

    box-shadow:0 0 40px rgba(255,255,255,.15);
}

.popupBox h2{
    color:white;
    font-size:32px;
    font-family:Georgia, serif;
    text-shadow:0 0 15px rgba(255,255,255,.4);
}

#moonTitle{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);

    width:90%;
    text-align:center;

    font-family:Georgia, serif;
    font-size:clamp(14px,2vw,24px);
    letter-spacing:10px;

    color:#f5f5f5;

    opacity:0;

    text-shadow:
        0 0 6px rgba(255,255,255,.6),
        0 0 18px rgba(255,255,255,.35),
        0 0 40px rgba(255,255,255,.18);

    transition:opacity 2.5s ease;
}

#msgBtn{
    position:absolute;
    top:78%;
    left:50%;
    transform:translateX(-50%);

    padding:12px 28px;

    background:transparent;
    color:white;

    border:1px solid rgba(255,255,255,.4);
    border-radius:30px;

    font-size:16px;
    font-family:Georgia, serif;

    cursor:pointer;

    opacity:0;

    transition:.4s;
}

#msgBtn:hover{
    background:rgba(255,255,255,.08);
    box-shadow:0 0 15px rgba(255,255,255,.25);
}

#moonText{
    position:absolute;
    top:62%;
    left:50%;
    transform:translateX(-50%);

    width:min(90%, 500px);
    max-width:520px;

    text-align:center;

   font-size:clamp(17px,4vw,28px);
line-height:1.5;
padding:0 12px;

    color:white;

    opacity:0;

    white-space:pre-line;
    word-wrap:break-word;

    font-family:Georgia, serif;

    text-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 18px rgba(255,255,255,.55),
        0 0 35px rgba(180,220,255,.35);
}





#moonText::after{
    content:"|";
    animation:cursorBlink .8s infinite;
}
@keyframes cursorBlink{
    50%{opacity:0;}
}


@keyframes twinkle{

    0%{
        opacity:.2;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:.2;
        transform:scale(.8);
    }

}

















</style>

</head>

<body>

<div id="stars"></div>
<img id="moonGlow" src="moon.png" alt="">
<img id="moon" src="moon.png" alt="Moon">

<div id="moonTitle">THE MOON IN 02-03-2006</div>

<div id="moonText"></div>
<button id="msgBtn">A Little Message</button>
<div id="intro">
    In a quiet night of March 2006...
</div>
<audio id="bgMusic" src="song1.mp3" loop></audio>
<div id="lovePopup">
    <div class="popupBox">
        <h2>I Love You ❤️</h2>
    </div>
</div>
<script>

const intro = document.getElementById("intro");

const texts = [
    "In a quiet night of March 2006...",
    "A little star was born...",
    "This star made my world light up."
];

let current = 0;

function showText(){

    intro.textContent = texts[current];
    intro.style.opacity = 1;

    // يبقى النص ظاهرًا 3.5 ثوانٍ
    setTimeout(() => {

        intro.style.opacity = 0;

        current++;

        if(current < texts.length){

            // انتظار ثانيتين قبل النص التالي
            setTimeout(showText, 2000);

        }

    }, 3500);

}

setTimeout(showText, 800);

const stars = document.getElementById("stars");

const STAR_COUNT = 450;

for(let i = 0; i < STAR_COUNT; i++){

    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random()*100 + "vw";
    star.style.top = Math.random()*100 + "vh";

    let size;

    const r = Math.random();

    if(r < 0.65){
        size = Math.random()*1.2 + 0.5;
    }
    else if(r < 0.93){
        size = Math.random()*2 + 1.3;
    }
    else{
        size = Math.random()*3 + 2.5;
    }

    star.style.width = size + "px";
    star.style.height = size + "px";

    if(Math.random() < 0.08){
        star.style.background = "#cfe8ff";
    }

    if(size > 2.3){
        star.style.boxShadow = `0 0 ${size*6}px rgba(255,255,255,.9)`;
    }

    stars.appendChild(star);

    setTimeout(()=>{

        star.style.transition =
            `opacity ${1 + Math.random()*1.8}s ease`;

        star.style.opacity =
            0.35 + Math.random()*0.65;

        star.style.animation =
            `twinkle ${2 + Math.random()*5}s infinite ease-in-out`;

}, 11000 + Math.random()*3000);
}






const moonText = document.getElementById("moonText");

function typeMoonText(){

const sentence = "This was the moon that watched\nover you on that night.";

    moonText.style.opacity = 1;
    moonText.textContent = "";

    let i = 0;

    const typing = setInterval(() => {

       if(sentence.charAt(i) === "\n"){
    moonText.innerHTML += "<br>";
}
else{
    moonText.innerHTML += sentence.charAt(i);
}
        i++;

        if(i >= sentence.length){
    clearInterval(typing);
    msgBtn.style.opacity = 1;
}
    },55);

}

const moonGlow = document.getElementById("moonGlow");
const moon = document.getElementById("moon");
const moonTitle = document.getElementById("moonTitle");
const msgBtn = document.getElementById("msgBtn");
setTimeout(() => {

    moonGlow.style.transition = "opacity 2.5s ease";
    moonGlow.style.opacity = 1;

    moon.style.transition = "opacity 2.5s ease";
    moon.style.opacity = 1;

    moonTitle.style.opacity = 1;

    setTimeout(typeMoonText,2500);

},17000);


const bgMusic = document.getElementById("bgMusic");

function startMusic(){
    bgMusic.volume = 0;
    bgMusic.play().then(() => {
        let fade = setInterval(() => {
            if (bgMusic.volume < 0.3) bgMusic.volume += 0.02;
            else clearInterval(fade);
        }, 200);
    }).catch(() => {});
}

startMusic();

document.addEventListener("click", function resumeMusic(){
    if(bgMusic.paused){
        startMusic();
    }
    document.removeEventListener("click", resumeMusic);
}, { once: true });

msgBtn.onclick = () => {
    lovePopup.classList.add("show");
};

lovePopup.onclick = () => {
    lovePopup.classList.remove("show");
};


</script>

</body>
</html>
