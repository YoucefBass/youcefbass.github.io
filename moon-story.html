<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Her Moon</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:black;

    display:flex;

    justify-content:center;
    align-items:center;

    color:white;

    font-family:Georgia, serif;

}

#intro{

    font-size:42px;

    opacity:0;

    transition:2s;

}

</style>

</head>

<body>

<div id="intro">

In a quiet night of March 2006...
</div>

<script>

const intro=document.getElementById("intro");

setTimeout(()=>{

    intro.style.opacity=1;

},1000);

setTimeout(()=>{

    intro.style.opacity=0;

},6000);

</script>

</body>

</html>
