<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Her Moon</title>

<style>

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    opacity:0;
    transition:opacity .8s;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Georgia, serif;
}

#intro{
    font-size:clamp(30px, 9vw, 42px);
    max-width:85%;
    text-align:center;
    line-height:1.3;
    opacity:0;
    transition:2s;
}




#moon{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    opacity:0;

    user-select:none;
    pointer-events:none;
}















    

@keyframes twinkle{

    0%{
        opacity:.25;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:.25;
    }

}

</style>

</head>

<body>

<div id="stars"></div>
<img id="moon" src="moon.png" alt="Moon">
<div id="intro">
    In a quiet night of March 2006...
</div>

<script>

const intro = document.getElementById("intro");

setTimeout(() => {
    intro.style.opacity = 1;
}, 800);

setTimeout(() => {
    intro.style.opacity = 0;
}, 4200);

const stars = document.getElementById("stars");

for(let i = 0; i < 120; i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.animationDelay = (Math.random() * 5) + "s";
    star.style.transitionDelay = (Math.random() * 1.5) + "s";

    stars.appendChild(star);
}

setTimeout(() => {

    document.querySelectorAll(".star").forEach((star, index) => {

        setTimeout(() => {

            star.style.opacity = 1;
            star.style.animation = "twinkle 3s infinite ease-in-out";

        }, index * 35);

    });

}, 4700);





const moon = document.getElementById("moon");

setTimeout(() => {
    moon.style.transition = "opacity 2.5s ease";
    moon.style.opacity = 1;
}, 9500);






</script>

</body>
</html>
