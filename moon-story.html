<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Her Moon</title>

<style>

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    opacity:0;
    transform:scale(.7);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Georgia, serif;
}

#intro{
    font-size:clamp(30px, 9vw, 42px);
    max-width:85%;
    text-align:center;
    line-height:1.3;
    opacity:0;
    transition:2s;
}




#moon{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    opacity:0;

    user-select:none;
    pointer-events:none;

   filter:
    brightness(1.05)
    contrast(1.08)
    drop-shadow(0 0 5px rgba(255,255,255,.10))
    drop-shadow(0 0 12px rgba(255,255,255,.05));
}











#moonGlow{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    opacity:0;

    pointer-events:none;

    filter:
        blur(8px)
        brightness(2);

    z-index:1;
}

#moon{
    position:absolute;

    top:22%;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    opacity:0;

    pointer-events:none;

    z-index:2;
}



    

@keyframes twinkle{

    0%{
        opacity:.2;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:.2;
        transform:scale(.8);
    }

}







.shooting-star{
    position:fixed;
    width:180px;
    height:2px;
    background:linear-gradient(90deg,#fff,rgba(255,255,255,.6),transparent);
    border-radius:999px;
    filter:drop-shadow(0 0 8px white);
    transform:rotate(45deg);
    pointer-events:none;
    z-index:999;
    animation:shooting 1.2s linear forwards;
}

@keyframes shooting{
    from{
        transform:translate(0,0) rotate(45deg);
        opacity:1;
    }
    to{
        transform:translate(-700px,700px) rotate(45deg);
        opacity:0;
    }
}



















    
    
</style>

</head>

<body>

<div id="stars"></div>
<img id="moonGlow" src="moon.png" alt="">
<img id="moon" src="moon.png" alt="Moon"><div id="intro">
    In a quiet night of March 2006...
</div>

<script>

const intro = document.getElementById("intro");

setTimeout(() => {
    intro.style.opacity = 1;
}, 800);

setTimeout(() => {
    intro.style.opacity = 0;
}, 4200);

const stars = document.getElementById("stars");

const STAR_COUNT = 450;

for(let i = 0; i < STAR_COUNT; i++){

    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random()*100 + "vw";
    star.style.top = Math.random()*100 + "vh";

    let size;

    const r = Math.random();

    if(r < 0.65){
        size = Math.random()*1.2 + 0.5;
    }
    else if(r < 0.93){
        size = Math.random()*2 + 1.3;
    }
    else{
        size = Math.random()*3 + 2.5;
    }

    star.style.width = size + "px";
    star.style.height = size + "px";

    if(Math.random() < 0.08){
        star.style.background = "#cfe8ff";
    }

    if(size > 2.3){
        star.style.boxShadow = `0 0 ${size*6}px rgba(255,255,255,.9)`;
    }

    stars.appendChild(star);

    setTimeout(()=>{

        star.style.transition =
            `opacity ${1 + Math.random()*1.8}s ease`;

        star.style.opacity =
            0.35 + Math.random()*0.65;

        star.style.animation =
            `twinkle ${2 + Math.random()*5}s infinite ease-in-out`;

    }, 5000 + Math.random()*4500);

}





const moon = document.getElementById("moon");

setTimeout(() => {
   moonGlow.style.transition = "opacity 2.5s ease";
moonGlow.style.opacity = 1;

moon.style.transition = "opacity 2.5s ease";
moon.style.opacity = 1;
}, 9500);




function createShootingStar(){

    const star = document.createElement("div");
    star.className = "shooting-star";

    star.style.left = (Math.random()*80 + 20) + "vw";
    star.style.top  = (Math.random()*30) + "vh";

    star.style.width = (120 + Math.random()*180) + "px";
    star.style.animationDuration = (0.8 + Math.random()*0.6) + "s";

    document.body.appendChild(star);

    setTimeout(() => {
        star.remove();
    }, 1500);
}

setTimeout(() => {

    createShootingStar();

    setInterval(createShootingStar, 5000);

}, 10000);

    




</script>

</body>
</html>
