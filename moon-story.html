<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Her Moon</title>

<style>



#stars{

    position:fixed;

    inset:0;

    overflow:hidden;

}

.star{

    position:absolute;

    width:2px;

    height:2px;

    background:white;

    border-radius:50%;

    opacity:0;

    transition:opacity 2s;

}




    

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:black;

    display:flex;

    justify-content:center;
    align-items:center;

    color:white;

    font-family:Georgia, serif;

}

#intro{

    font-size:42px;

    opacity:0;

    transition:2s;

}

</style>

</head>

<body>

<div id="stars"></div>

<div id="intro">
In a quiet night of March 2006...
</div>

<script>

const intro=document.getElementById("intro");

setTimeout(()=>{

    intro.style.opacity=1;

},800);

setTimeout(()=>{

    intro.style.opacity=0;

},4200);


const stars=document.getElementById("stars");

for(let i=0;i<120;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";

    star.style.top=Math.random()*100+"vh";

    star.style.transitionDelay=(Math.random()*4)+"s";

    stars.appendChild(star);

}

setTimeout(()=>{

    document.querySelectorAll(".star").forEach(star=>{

        star.style.opacity=1;

    });

},4700);


    

</script>

</body>

</html>
