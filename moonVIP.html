<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moon VIP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{




    <div id="spaceReveal"></div>

<div id="intro">
    In a quiet night of March 2006...
</div>
    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Georgia, serif;
    color:white;

    background-image:url("space2.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

}

#intro{

    font-size:clamp(30px,9vw,42px);

    max-width:85%;

    text-align:center;

    line-height:1.3;

    opacity:0;

    transition:2s;

    text-shadow:
        0 0 10px rgba(255,255,255,.25);

}








    #spaceReveal{
    position:fixed;
    inset:0;

    background:black;

    opacity:1;

    transition:4s ease;

    pointer-events:none;
}
</style>

</head>

<body>

<div id="intro">
    In a quiet night of March 2006...
</div>

<script>

const intro=document.getElementById("intro");
const spaceReveal=document.getElementById("spaceReveal");
setTimeout(()=>{

    intro.style.opacity=1;

},800);

setTimeout(()=>{

    intro.style.opacity=0;

},4200);




    setTimeout(()=>{

    spaceReveal.style.opacity = 0;

},4700);

</script>

</body>

</html>
