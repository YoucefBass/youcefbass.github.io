<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Light It Up ✨</title>

    <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050509;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    touch-action: manipulation;
}
#game {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;

}


.star {
    position: absolute;

    width: 14px;
    height: 14px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px white,
        0 0 35px rgba(255, 255, 255, 0.8);

    cursor: pointer;
}








      
    </style>
</head>

<body>

    <div id="game">

    </div>

    <script>

// شكل كل حرف داخل شبكة
const letters = {
    I: [
        "111",
        "010",
        "010",
        "010",
        "111"
    ],

    M: [
        "10001",
        "11011",
        "10101",
        "10001",
        "10001"
    ],

    S: [
        "1111",
        "1000",
        "1111",
        "0001",
        "1111"
    ],

    Y: [
        "10001",
        "01010",
        "00100",
        "00100",
        "00100"
    ],

    O: [
        "01110",
        "10001",
        "10001",
        "10001",
        "01110"
    ],

    U: [
        "10001",
        "10001",
        "10001",
        "10001",
        "01110"
    ]
};


// الجملة التي نريد رسمها
const lines = [
    "I MISS",
    "YOU"
];

const stars = [];

const cellX = 5;       // المسافة الأفقية بين النجوم
const cellY = 7;       // المسافة العمودية بين النجوم

const letterGap = 5;   // المسافة بين الحروف
const wordGap = 8;     // المسافة بين الكلمات

const startY = 18;


// إنشاء النجوم تلقائياً
lines.forEach((line, lineIndex) => {

    let currentX = 6;

    for (const char of line) {

        // إذا كانت مسافة بين الكلمات
        if (char === " ") {
            currentX += wordGap;
            continue;
        }

        const pattern = letters[char];

        // رسم الحرف
        pattern.forEach((row, rowIndex) => {

            [...row].forEach((cell, colIndex) => {

                if (cell === "1") {

                    stars.push({
                        x: currentX + colIndex * cellX,
                        y: startY + lineIndex * 44 + rowIndex * cellY
                    });

                }

            });

        });

        // حساب عرض الحرف
        currentX += pattern[0].length * cellX + letterGap;

    }

});
function createStar(star) {

    const element = document.createElement("div");

    element.classList.add("star");

    element.style.left = star.x + "%";

    element.style.top = star.y + "%";

    document
        .getElementById("game")
        .appendChild(element);
}

createStar(stars[0]);



let currentStar = 0;

function createStar(star) {

    const element = document.createElement("div");

    element.classList.add("star");

    element.style.left = star.x + "%";
    element.style.top = star.y + "%";

    element.addEventListener("click", function () {

        currentStar++;

        if (currentStar < stars.length) {
            createStar(stars[currentStar]);
        }

    });

    document
        .getElementById("game")
        .appendChild(element);
}


// إظهار أول نجمة
createStar(stars[0]);







      
    </script>

</body>
</html>
