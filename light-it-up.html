<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Light It Up ✨</title>

    <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050509;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    touch-action: manipulation;
}
#game {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;

}


.star {
    position: absolute;

    width: 14px;
    height: 14px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    /* النقطة قبل الضغط */
    background: rgba(255, 255, 255, 0.25);

    box-shadow:
        0 0 4px rgba(255, 255, 255, 0.2);

    cursor: pointer;
}


/* بعد الضغط تصبح مضيئة */
.star.lit {
    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px white,
        0 0 35px rgba(255, 255, 255, 0.8);

    pointer-events: none;
}





#popup {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(5, 5, 9, 0.88);

    z-index: 100;
}


.popup-box {
    width: 85%;
    max-width: 360px;

    padding: 35px 25px;

    text-align: center;

    background: rgba(20, 20, 30, 0.95);

    border: 1px solid rgba(255, 255, 255, 0.15);

    border-radius: 24px;

    box-shadow:
        0 0 30px rgba(255, 255, 255, 0.08);
}


.popup-box h1 {
    margin: 0 0 15px;

    color: white;

    font-size: 28px;
}


.popup-box p {
    margin: 0 0 30px;

    color: rgba(255, 255, 255, 0.7);

    font-size: 17px;

    line-height: 1.5;
}


#startButton {
    border: none;

    padding: 14px 40px;

    border-radius: 30px;

    background: white;

    color: #050509;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

#timer {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 20px;
    font-weight: bold;

    font-family: Arial, sans-serif;

    letter-spacing: 1px;

    z-index: 50;

    text-shadow:
        0 0 8px rgba(255, 255, 255, 0.6);
}

    </style>
</head>

<body>

    <div id="game">
<div id="timer">1:30</div>
    </div>

<div id="popup">

    <div class="popup-box">

        <h1>Ready? ✨</h1>

        <p>
            Light up as many dots as you can in 90 seconds !
        </p>

        <button id="startButton">
            START
        </button>

    </div>

</div>




    
 <script>

const stars = [

    // I
    { x: 50, y: 17 },
    { x: 50, y: 21 },
    { x: 50, y: 25 },

    // M
    { x: 15, y: 37 },
    { x: 15, y: 41 },
    { x: 15, y: 45 },
    { x: 15, y: 49 },
    { x: 15, y: 53 },
    { x: 19, y: 39 },
    { x: 23, y: 42 },
    { x: 27, y: 39 },
    { x: 31, y: 37 },
    { x: 31, y: 41 },
    { x: 31, y: 45 },
    { x: 31, y: 49 },
    { x: 31, y: 53 },

    // I
    { x: 44, y: 37 },
    { x: 44, y: 41 },
    { x: 44, y: 45 },
    { x: 44, y: 49 },
    { x: 44, y: 53 },

    // S
    { x: 57, y: 37 },
    { x: 61, y: 37 },
    { x: 65, y: 37 },
    { x: 55, y: 40 },
    { x: 57, y: 44 },
    { x: 61, y: 44 },
    { x: 65, y: 47 },
    { x: 65, y: 50 },
    { x: 55, y: 53 },
    { x: 59, y: 53 },
    { x: 63, y: 53 },

    // S
    { x: 79, y: 37 },
    { x: 83, y: 37 },
    { x: 87, y: 37 },
    { x: 76, y: 40 },
    { x: 79, y: 44 },
    { x: 83, y: 44 },
    { x: 87, y: 47 },
    { x: 87, y: 50 },
    { x: 76, y: 53 },
    { x: 80, y: 53 },
    { x: 84, y: 53 },

    // Y
    { x: 21, y: 66 },
    { x: 36, y: 66 },
    { x: 25, y: 69 },
    { x: 32, y: 69 },
    { x: 28, y: 72 },
    { x: 28, y: 76 },
    { x: 28, y: 80 },

    // O
    { x: 48, y: 66 },
    { x: 53, y: 66 },
    { x: 44, y: 69 },
    { x: 57, y: 69 },
    { x: 44, y: 73 },
    { x: 57, y: 73 },
    { x: 44, y: 77 },
    { x: 57, y: 77 },
    { x: 48, y: 80 },
    { x: 53, y: 80 },

    // U
    { x: 67, y: 66 },
    { x: 80, y: 66 },
    { x: 67, y: 70 },
    { x: 80, y: 70 },
    { x: 67, y: 74 },
    { x: 80, y: 74 },
    { x: 67, y: 78 },
    { x: 80, y: 78 },
    { x: 71, y: 80 },
    { x: 75, y: 80 },
    { x: 78, y: 80 }

];


// خلط النقاط عشوائياً
const shuffledStars = [...stars];

for (let i = shuffledStars.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [shuffledStars[i], shuffledStars[j]] =
    [shuffledStars[j], shuffledStars[i]];

}


// رقم النقطة الحالية
let currentStar = 0;


// إنشاء نقطة
function createStar(star) {

    const element = document.createElement("div");

    element.classList.add("star");

    element.style.left = star.x + "%";
    element.style.top = star.y + "%";


    // عند الضغط على النقطة
    element.addEventListener("click", function () {

        // تضيء النقطة وتبقى
        element.classList.add("lit");

        // الانتقال للنقطة التالية
        currentStar++;

        if (currentStar < shuffledStars.length) {

            createStar(shuffledStars[currentStar]);

        }

    });


    document
        .getElementById("game")
        .appendChild(element);

}
let timeLeft = 90;

let timerInterval;

function startTimer() {

    timerInterval = setInterval(function () {

        timeLeft--;

        const minutes = Math.floor(timeLeft / 60);

        const seconds = timeLeft % 60;

        document.getElementById("timer").textContent =
            minutes + ":" + String(seconds).padStart(2, "0");

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

        }

    }, 1000);

}

// زر START
document
    .getElementById("startButton")
    .addEventListener("click", function () {

        // إخفاء النافذة
        document
            .getElementById("popup")
            .style.display = "none";

        // بدء العداد
        startTimer();

        // بدء اللعبة
        createStar(shuffledStars[0]);

    });
</script>


</body>
</html>
