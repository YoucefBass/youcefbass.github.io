<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Light It Up ✨</title>

    <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050509;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    touch-action: manipulation;
}
#game {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;

}


.star {
    position: absolute;

    width: 22px;
    height: 22px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px white,
        0 0 35px rgba(255, 255, 255, 0.8);

    cursor: pointer;
}








      
    </style>
</head>

<body>

    <div id="game">

    </div>

    <script>

const stars = [

    // I
    { x: 15, y: 20 },
    { x: 15, y: 26 },
    { x: 15, y: 32 },
    { x: 15, y: 38 },
    { x: 15, y: 44 },

    // M
    { x: 28, y: 44 },
    { x: 28, y: 20 },
    { x: 32, y: 26 },
    { x: 36, y: 32 },
    { x: 40, y: 26 },
    { x: 44, y: 20 },
    { x: 44, y: 44 },

    // I
    { x: 52, y: 20 },
    { x: 52, y: 26 },
    { x: 52, y: 32 },
    { x: 52, y: 38 },
    { x: 52, y: 44 },

    // S
    { x: 66, y: 20 },
    { x: 62, y: 24 },
    { x: 62, y: 28 },
    { x: 66, y: 32 },
    { x: 70, y: 36 },
    { x: 70, y: 40 },
    { x: 66, y: 44 },

    // S
    { x: 82, y: 20 },
    { x: 78, y: 24 },
    { x: 78, y: 28 },
    { x: 82, y: 32 },
    { x: 86, y: 36 },
    { x: 86, y: 40 },
    { x: 82, y: 44 },


    // Y
    { x: 32, y: 60 },
    { x: 40, y: 60 },
    { x: 36, y: 66 },
    { x: 36, y: 72 },
    { x: 36, y: 78 },
    { x: 36, y: 84 },

    // O
    { x: 52, y: 60 },
    { x: 48, y: 66 },
    { x: 48, y: 72 },
    { x: 52, y: 78 },
    { x: 56, y: 72 },
    { x: 56, y: 66 },

    // U
    { x: 66, y: 60 },
    { x: 66, y: 66 },
    { x: 66, y: 72 },
    { x: 66, y: 78 },
    { x: 70, y: 84 },
    { x: 74, y: 78 },
    { x: 74, y: 72 },
    { x: 74, y: 66 },
    { x: 74, y: 60 }
];


function createStar(star) {

    const element = document.createElement("div");

    element.classList.add("star");

    element.style.left = star.x + "%";

    element.style.top = star.y + "%";

    document
        .getElementById("game")
        .appendChild(element);
}

createStar(stars[0]);



let currentStar = 0;

function createStar(star) {

    const element = document.createElement("div");

    element.classList.add("star");

    element.style.left = star.x + "%";
    element.style.top = star.y + "%";

    element.addEventListener("click", function () {

        currentStar++;

        if (currentStar < stars.length) {
            createStar(stars[currentStar]);
        }

    });

    document
        .getElementById("game")
        .appendChild(element);
}


// إظهار أول نجمة
createStar(stars[0]);







      
    </script>

</body>
</html>
