body {

#game {

}


.star {
    position: absolute;

    width: 14px;
    height: 14px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px white,
        0 0 35px rgba(255, 255, 255, 0.8);

    cursor: pointer;
}

function createStar(star) {

let currentStar = 0;

function createStar(star) {

    const element = document.createElement("div");

    element.classList.add("star");

    element.style.left = star.x + "%";
    element.style.top = star.y + "%";

    element.addEventListener("click", function () {

        currentStar++;

        if (currentStar < stars.length) {
            createStar(stars[currentStar]);
        }

    });

    document
        .getElementById("game")
        .appendChild(element);
}
